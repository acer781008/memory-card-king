<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>翻牌記憶王｜主控登入</title></head><body><main class="wrap login"><div class="hero"><h1>👑 翻牌記憶王</h1><p>動動腦・找配對・成為記憶王！</p></div><section class="panel"><h2>🔐 主控登入</h2><input id="pw" type="password" placeholder="輸入主控密碼"><button onclick="login()">進入主控室</button><p id="msg" class="status"></p><p class="small">本機測試預設密碼：1234</p></section></main><script>function login(){const p=document.getElementById('pw'),m=document.getElementById('msg');if(p.value==='1234'){sessionStorage.mkAdmin='1';location='admin.html'}else m.textContent='密碼錯誤'}</script></body></html>
